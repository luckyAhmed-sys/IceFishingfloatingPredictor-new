name: Build Ice Fishing Predictor APK

"on":
  workflow_dispatch:
  push:
    branches: [main, auto-detection-development]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Plugin Dependencies
        run: rm -rf ice-fishing-auto-detection/node_modules ice-fishing-auto-detection/package-lock.json && npm install --include=optional --prefix ice-fishing-auto-detection

      - name: Build Custom Plugin
        run: npm run build --prefix ice-fishing-auto-detection

      - name: Install App Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ice-Fishing-Predictor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
